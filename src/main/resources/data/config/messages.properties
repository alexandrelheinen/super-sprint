messages.help.info.title=How to play
messages.help.info.goal.title=Goal
messages.help.info.goal.body=Super Sprint Supélec is a top-down arcade racer. Be first to finish the chosen lap count on a modular track built from wide road tiles.
messages.help.info.setup.title=Race setup
messages.help.info.setup.body=Choose Single Player or Multiplayer, then pick car model(s), track, and lap count. Empty grid slots are filled by AI opponents that follow the racing line.
messages.help.info.driving.title=On the track
messages.help.info.driving.body=Stay on the asphalt - leaving the lane cuts your speed hard. Cross the yellow finish line in the racing direction to count a lap. Steering only affects heading while the car is moving; release accelerate/brake to coast down with friction.
messages.help.info.collisions.title=Bumps
messages.help.info.collisions.body=Cars can nudge each other. Contact briefly mixes speed and heading - useful for blocking a rival, risky when you are already near the curb.
messages.help.info.scoring.title=Winning & Hall of Fame
messages.help.info.scoring.body=First to complete the lap count wins. Human winners who place can save a name to the Hall of Fame. Rankings use mean lap time (total time ÷ laps), so short and long races stay comparable.
messages.help.info.project=Software Project 2014/2015 - Sequence 6 (Supélec). English UI in a single-window shell.
messages.help.button.close=Back to Menu

