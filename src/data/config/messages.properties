messages.help.info.title=How to play
messages.help.info.body=Super Sprint Supélec is a top-down arcade racer on modular tracks.\n\nRace setup\n• Choose Single Player or Multiplayer from the main menu.\n• Pick a car model, track, and lap count before starting.\n• Empty grid slots are filled by AI opponents.\n\nOn the track\n• Stay on the asphalt — leaving the lane cuts your speed.\n• Cross the yellow finish line in the racing direction to count laps.\n• Cars can bump each other; contact mixes speed and heading briefly.\n\nWinning & Hall of Fame\n• First to complete the chosen lap count wins.\n• Human winners who place can save a name to the Hall of Fame.\n• Rankings use mean lap time (total time ÷ laps), so different race lengths stay comparable.\n\nProject\nSoftware Project 2014/2015 — Sequence 6 (Supélec). Maintained with English UI and a single-window shell.
