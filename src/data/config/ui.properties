# UI scaling: default window is half screen width × half screen height (1/4 of total area).

ui.scale.min.window.width=640
ui.scale.min.window.height=480
ui.scale.min.font.size=14
ui.scale.screen.width.divisor=2
ui.scale.screen.height.divisor=2
# Fixed AppShell content area as a fraction of the display (never changes at runtime).
ui.scale.shell.width.ratio=0.55
ui.scale.shell.height.ratio=0.72
