name: CI

on:
  push:
    branches: [master, 'cursor/**']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install headless display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-pil

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew classes --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Smoke test application launch
        run: ./gradlew smokeTest --no-daemon
