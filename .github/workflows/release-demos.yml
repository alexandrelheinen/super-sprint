name: Release demos

# Records two all-AI exhibition races on a v* tag push and attaches the MP4s to
# the GitHub Release for that tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-demos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool python3-pil openbox

      - name: Record release demo races
        env:
          DEMO_FPS: '30'
        run: |
          set -euo pipefail
          # Grid order is ascending maxSpeed (slowest in front, fastest last).
          # Fastest four: 2,1,7,4 on Dune Horseshoe. Slowest four: 5,6,3,0 on Desert Elbow.
          FAST_MP4=artifacts/demo/ai-demo-fastest-increasing-dune-horseshoe.mp4
          SLOW_MP4=artifacts/demo/ai-demo-slowest-increasing-desert-elbow.mp4
          # Fresh Xvfb per demo so a previous Java/openbox session cannot leave
          # stale window ids that break xdotool on the next recording.
          record_one() {
            local track="$1" cars="$2" output="$3"
            # 1920x1440 leaves headroom for window chrome; DemoRaceCapture is also
            # launched with -Dsun.java2d.uiScale=1 so the shell stays in-bounds.
            xvfb-run -a -s '-screen 0 1920x1440x24' bash -lc "
              set -euo pipefail
              openbox &
              sleep 1
              ./gradlew --no-daemon recordDemo \
                -PTRACK=${track} -PCARS=${cars} -PLAPS=3 \
                -PDEMO_MP4=${output}
            "
            test -s "${output}"
          }
          record_one 3 2,1,7,4 "${FAST_MP4}"
          record_one 1 5,6,3,0 "${SLOW_MP4}"

      - name: Upload demo videos as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-demo-videos
          path: |
            artifacts/demo/ai-demo-fastest-increasing-dune-horseshoe.mp4
            artifacts/demo/ai-demo-slowest-increasing-desert-elbow.mp4
          if-no-files-found: error

      - name: Attach demo videos to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/demo/ai-demo-fastest-increasing-dune-horseshoe.mp4
            artifacts/demo/ai-demo-slowest-increasing-desert-elbow.mp4
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
